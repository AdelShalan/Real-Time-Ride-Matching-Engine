global:
  # 5s matches the load-test resolution: slower scraping smooths away the latency spikes the
  # tests exist to find.
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # All six services expose the same endpoint on the same port inside the compose network,
  # so one job with a target list beats six near-identical jobs. The "service" label comes
  # from Micrometer's own `application` tag, set from spring.application.name.
  - job_name: ride-matching
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "dispatch-api:8080"
          - "location-service:8080"
          - "matching-engine:8080"
          - "trip-service:8080"
          - "notification-service:8080"
          - "billing-service:8080"
    relabel_configs:
      # Strip the port so the instance label reads "dispatch-api" rather than
      # "dispatch-api:8080" — every panel legend is shorter and the dashboards stay readable.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"
