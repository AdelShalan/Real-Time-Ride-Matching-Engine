# Infrastructure for the Real-Time Ride-Matching Engine.
#
# Used two ways, from one definition:
#   1. As the base of the dev container (see .devcontainer/docker-compose.dev.yml)
#   2. Standalone:  podman compose -f ops/docker-compose.yml up -d
#
# Application services are added here in later phases. Prometheus and Grafana sit
# behind the "observability" profile so day-to-day startup stays fast:
#   podman compose -f ops/docker-compose.yml --profile observability up -d

name: ride-matching-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
      POSTGRES_DB: ride
      # Faster startup; this database is disposable.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride -d ride"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - ride-net

  redis:
    image: redis:7-alpine
    # appendonly + everysec: a warm restart keeps the geo index rather than starting
    # empty. Durability is not required here (ADR-0002) but a fast restart is convenient.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - ride-net

  kafka:
    # KRaft mode: single node, no ZooKeeper.
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      # Two advertised listeners: "kafka:9092" for containers on ride-net,
      # "localhost:29092" for tools running on Windows. A client that connects on the
      # wrong one gets a metadata response pointing at an unreachable host.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Single broker: everything replication-related must be 1 or the broker won't start.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # No rebalance delay in dev: consumers should join instantly on restart.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "ride-matching-kraft-cluster"
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - ride-net

  # ---------------------------------------------------------------------------------
  # Application services. Behind the "app" profile so day-to-day dev container work does
  # not rebuild six images; the load test and the Grafana dashboards need them running:
  #
  #   ./mvnw package -DskipTests
  #   podman compose -f ops/docker-compose.yml --profile app --profile observability up -d --build
  # ---------------------------------------------------------------------------------
  dispatch-api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        SERVICE: dispatch-api
    environment:
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ride
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # See ops/healthcheck.sh: a dependency-free probe that asserts the response body says
      # UP, not merely that the port accepts connections.
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ride-net

  location-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        SERVICE: location-service
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # See ops/healthcheck.sh: a dependency-free probe that asserts the response body says
      # UP, not merely that the port accepts connections.
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ride-net

  matching-engine:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        SERVICE: matching-engine
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # See ops/healthcheck.sh: a dependency-free probe that asserts the response body says
      # UP, not merely that the port accepts connections.
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ride-net

  trip-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        SERVICE: trip-service
    environment:
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ride
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # See ops/healthcheck.sh: a dependency-free probe that asserts the response body says
      # UP, not merely that the port accepts connections.
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ride-net

  notification-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        SERVICE: notification-service
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8084:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # See ops/healthcheck.sh: a dependency-free probe that asserts the response body says
      # UP, not merely that the port accepts connections.
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ride-net

  billing-service:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        SERVICE: billing-service
    environment:
      SERVER_PORT: "8080"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8085:8080"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # See ops/healthcheck.sh: a dependency-free probe that asserts the response body says
      # UP, not merely that the port accepts connections.
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ride-net

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - promdata:/prometheus
    networks:
      - ride-net

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      # Local-only stack; anonymous admin keeps the load-test screenshots frictionless.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "light"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ride-net

networks:
  ride-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  kafkadata:
  promdata:
  grafanadata:
