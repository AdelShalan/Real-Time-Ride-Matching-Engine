# Dev-container overlay. Merged on top of ops/docker-compose.yml by devcontainer.json.
# Adds the workspace container that VS Code attaches to; the infrastructure services
# come from the base file so `podman compose up` and the dev container run the exact
# same Postgres, Redis and Kafka definitions.

services:
  workspace:
    # Java 25 (LTS). The runtime matters more than the language level here:
    # JDK 24 shipped JEP 491, which removed virtual-thread pinning on synchronized.
    image: mcr.microsoft.com/devcontainers/java:25-bookworm

    # Keep the container alive; VS Code execs into it.
    command: sleep infinity

    volumes:
      # ":z" is an SELinux relabel, required by Podman on SELinux hosts and harmless
      # elsewhere. Without it, bind mounts are unreadable inside the container on Fedora/RHEL.
      - ..:/workspace:z
      # Named volume for the Maven repo: survives rebuilds, and avoids ~500MB of
      # dependency downloads crossing the Windows <-> VM filesystem boundary on every build.
      # Podman creates this mount point owned by root while the container runs as vscode,
      # so post-create.sh chowns it — otherwise the first mvn run fails outright.
      # Note this only helps processes whose HOME is /home/vscode: a `podman exec` without
      # --user runs as root, whose Maven writes to /root/.m2 and is lost on rebuild.
      - maven-repo:/home/vscode/.m2
      # Podman's API socket, presented under the Docker path Testcontainers expects.
      # This is the alternative to docker-in-docker promised in ADR-0007: containers the
      # tests start are siblings under the same rootless engine, not a nested daemon.
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:z

    # REQUIRED under rootless Podman. Without it the container's root maps to the host user,
    # so everything on the 9p-mounted /workspace appears as root:root 0777 to the container.
    # The "vscode" user (uid 1000) can then write file CONTENTS but cannot call utimes() on
    # them — POSIX requires ownership for that — and Maven's resources plugin preserves
    # timestamps when it copies, so every build dies with:
    #   "... .imports: Operation not permitted"
    # keep-id maps container uid 1000 to host uid 1000, which is what actually owns these
    # files in the Podman VM, so vscode owns them too. It also makes the podman.sock mount
    # below readable by vscode rather than root-only.
    # Podman-only; Docker rejects this value.
    userns_mode: "keep-id"

    environment:
      # Service hostnames resolve on the shared compose network. Application config
      # reads these, so the same code works in the dev container and in CI.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ride
      SPRING_DATASOURCE_USERNAME: ride
      SPRING_DATASOURCE_PASSWORD: ride
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: UTC

      # Testcontainers talks to Podman through the mounted socket above.
      DOCKER_HOST: unix:///var/run/docker.sock
      # Ryuk is the reaper container Testcontainers starts to clean up after a crashed JVM.
      # It needs privileges rootless Podman will not grant, so it is disabled; containers are
      # instead removed by the JVM shutdown hook. Acceptable in dev, and the compose stack is
      # disposable anyway.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Containers started by a test are SIBLINGS of this one, so their published ports land
      # on the podman VM's host interface, not on this container's loopback. Without this,
      # Testcontainers polls its own localhost and every container times out after 60s with
      # "Timed out waiting for container port to open". Podman maps this name to the host.
      TESTCONTAINERS_HOST_OVERRIDE: host.containers.internal

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - ride-net

volumes:
  maven-repo:
