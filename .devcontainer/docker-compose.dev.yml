# Dev-container overlay. Merged on top of ops/docker-compose.yml by devcontainer.json.
# Adds the workspace container that VS Code attaches to; the infrastructure services
# come from the base file so `podman compose up` and the dev container run the exact
# same Postgres, Redis and Kafka definitions.

services:
  workspace:
    image: mcr.microsoft.com/devcontainers/java:21-bookworm

    # Keep the container alive; VS Code execs into it.
    command: sleep infinity

    volumes:
      # ":z" is an SELinux relabel, required by Podman on SELinux hosts and harmless
      # elsewhere. Without it, bind mounts are unreadable inside the container on Fedora/RHEL.
      - ..:/workspace:z
      # Named volume for the Maven repo: survives rebuilds, and avoids ~500MB of
      # dependency downloads crossing the Windows <-> VM filesystem boundary on every build.
      - maven-repo:/home/vscode/.m2
      # Podman's API socket, presented under the Docker path Testcontainers expects.
      # This is the alternative to docker-in-docker promised in ADR-0007: containers the
      # tests start are siblings under the same rootless engine, not a nested daemon.
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:z

    # Rootless Podman maps the container's root to your host user. Because we run as
    # "vscode" (uid 1000) rather than root, writes to /workspace can fail with EACCES.
    # If that happens, uncomment the line below (Podman-only; Docker will reject the value).
    # userns_mode: "keep-id"

    environment:
      # Service hostnames resolve on the shared compose network. Application config
      # reads these, so the same code works in the dev container and in CI.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ride
      SPRING_DATASOURCE_USERNAME: ride
      SPRING_DATASOURCE_PASSWORD: ride
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TZ: UTC

      # Testcontainers talks to Podman through the mounted socket above.
      DOCKER_HOST: unix:///var/run/docker.sock
      # Ryuk is the reaper container Testcontainers starts to clean up after a crashed JVM.
      # It needs privileges rootless Podman will not grant, so it is disabled; containers are
      # instead removed by the JVM shutdown hook. Acceptable in dev, and the compose stack is
      # disposable anyway.
      TESTCONTAINERS_RYUK_DISABLED: "true"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - ride-net

volumes:
  maven-repo:
